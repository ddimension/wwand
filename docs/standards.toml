[[component]]
name = "Datapath: QMAP and rmnet"
code = "src-ucode/{netlink,modem_datapath_qmi,datapath_rmnet_nss,datapath_rmnet_nss_mhi}.uc, codec/schema/wda.uc, io/src/wwand-io.c"
  [[component.standard]]
  name = "Linux rmnet / qmi_wwan / cdc_mbim drivers"
  basis = "linux 6.18.41 (drivers/net/ethernet/qualcomm/rmnet, drivers/net/usb)"
  sections = "IFLA_RMNET_* flags (masked apply), mux ids, raw-ip, rx_urb_size"
    [[component.standard.review]]
    review = "tbd"
  [[component.standard]]
  name = "QMAP v1/v4/v5 data aggregation, as documented by libqmi"
  basis = "libqmi 1.38.0 (WDA data aggregation protocol enums)"
  sections = "DAP ids, aggregation limits"
    [[component.standard.review]]
    review = "R1"
    result = "ids, TLVs, widths and enums match; DAP -> rmnet flags right; UL aggregation limits now clamped to the kernel's, parent MTU step fits MAP v4"
    open = "request TLVs 0x18-0x1A unverified (not modelled by libqmi, not sent); QMAP v4 not HW-proven (both QMI modems decline it)"

