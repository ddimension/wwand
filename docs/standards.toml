  name = "Qualcomm QMI, as documented by libqmi"
  basis = "libqmi 1.38.0 data/qmi-service-*.json"
  sections = "CTL, DMS, NAS, WDS, WDA, UIM, WMS, LOC, PDC, DSD, TMD, CAT: message ids, TLV ids, enums"
    [[component.standard.review]]
    review = "tbd"

