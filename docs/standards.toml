# Components, the standards they implement, and every check against them.
#
# Source of docs/standards.md – edit this file, then run
#   python3 tools/standards.py
# (run_tests.sh fails if standards.md is out of date). One [[component]] per
# component, one [[component.standard]] per standard or reference it follows,
# one [[component.standard.review]] per check of that standard in that
# component. `review` names an entry of [[reviews]] (date, kind, commits), or
# "tbd" while the component has not been checked against it yet.
#
# A check counts when someone read the standard's text next to the code — not
# when the code was written from it, and not when a test passed. What the code
# was written against is `basis`; the review row says when that was last
# compared. Add a [[reviews]] entry for every such check and point the rows it
# covered at it.
#
# Where no public standard exists (QMI, vendor AT sets), the reference
# implementation the code is verified against is the "standard", with its
# version: that is the rule in CLAUDE.md ("QMI schemas must match libqmi").

