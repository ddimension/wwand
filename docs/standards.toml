[[component]]
name = "MBIM codec and backend"
code = "src-ucode/codec/mbim.uc, codec/mbim_schema/*.uc, {mbim_backend,mbim_client,modem_mbim,context_mbim,telemetry_mbim}.uc"
  [[component.standard]]
  name = "USB-IF MBIM 1.0"
  basis = "libmbim 1.32"
  sections = "message framing, OPEN/CLOSE, fragments, Basic Connect CIDs, status codes"
    [[component.standard.review]]
    review = "tbd"
  [[component.standard]]
  name = "Microsoft MBIM extensions (MBIMEx v2/v3, MS Basic Connect Extensions, MS UICC Low Level Access, MS Voice Extensions NITZ)"
  basis = "libmbim 1.32"
  sections = "version exchange, registration/packet service v2/v3, base stations info, UICC APDU/open channel/reset, NITZ (voice extensions CID 10)"
    [[component.standard.review]]
    review = "R4"
    result = "MS UICC Low Level Access only: request layouts and the APDU status (SW1 low byte) match; OPEN_CHANNEL's in-band Status (SELECT SW1 SW2) and Channel 0 = failed were not evaluated, so a refused select under an MBIM success read as a channel (fixed; Status 0 with a channel tolerated, lpac never reads it)"
    open = "MBIMEx v2/v3, base stations info and NITZ not checked against the Microsoft text yet; UICC open not HW-verified (no eUICC-capable MBIM modem)"

[[component]]
name = "QMI-over-MBIM passthrough"
code = "src-ucode/{qmi_over_mbim,atcmd_mbim}.uc, codec/mbim_schema/qmi_passthrough.uc"
  [[component.standard]]
  name = "Qualcomm QMI service over MBIM (QMI passthrough UUID)"
  basis = "libmbim 1.32, libqmi 1.38.0 (qmi-device over MBIM)"
  sections = "QMI message CID, indications per service, no CTL SYNC"
    [[component.standard.review]]
    review = "tbd"

[[component]]
name = "QMI over QRTR"
code = "src-ucode/qmi_over_qrtr.uc, io/src/wwand-io.c (qrtr_*), discovery.uc (qrtr_*)"
  [[component.standard]]
  name = "Qualcomm IPC router (QRTR) and its name server"
  basis = "linux 6.18.41 net/qrtr (ns.c, qmi_interface.c), include/uapi/linux/qrtr.h"
  sections = "control packets (NEW/DEL_SERVER, NEW_LOOKUP), one socket per QMI client, SDU without QMUX header, tx flow control (qrtr_tx_wait)"
    [[component.standard.review]]
    review = "R5"
    result = "tx flow control read next to qmit_qsend: a send sleeps at 10 unconfirmed packets per destination regardless of SOCK_NONBLOCK, and the EINTR retry kept it there through SIGTERM; bounded with SIGALRM, the hub backs off a blocked service"
    open = "control packets, socket-per-client and the SDU framing not yet read against af_qrtr.c/ns.c; no recovery beyond the ladder for a flow the modem never confirms (an MHI soc_reset would free it)"

